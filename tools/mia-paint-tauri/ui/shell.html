<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIA Paint</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12151c; color: #c8d0e0; font-family: system-ui, sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #boot { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 12px; padding: 24px; text-align: center; }
    #boot[hidden] { display: none; }
    a { color: #7eb8ff; }
  </style>
</head>
<body>
  <div id="boot">
    <p>MIA server neběží na <code id="bootUrl"></code>.</p>
    <p>Spusť v kořeni repa: <code>npm start</code></p>
    <p><a id="retryLink" href="#">Zkusit znovu</a></p>
  </div>
  <iframe id="paintFrame" title="MIA Paint" hidden allow="clipboard-read; clipboard-write"></iframe>
  <script src="bridge.js"></script>
</body>
</html>
