<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIA Combo Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    #root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #flash {
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.12), transparent 55%);
      transition: opacity 280ms ease;
    }

    #flash.on { opacity: 1; }

    #waveHud {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      width: min(760px, 92vw);
      padding: 16px 20px 14px;
      border-radius: 22px;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 320ms ease, transform 420ms cubic-bezier(0.18, 0.9, 0.2, 1);
      border: 2px solid rgba(122, 215, 255, 0.28);
      background:
        radial-gradient(circle at 0% 0%, rgba(0, 234, 255, 0.16), transparent 42%),
        linear-gradient(160deg, rgba(6, 16, 32, 0.94), rgba(10, 24, 44, 0.9));
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
    }

    #waveHud.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #waveHud.confirmed {
      border-color: rgba(0, 234, 255, 0.55);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(0, 234, 255, 0.22);
    }

    #waveHud.pulse {
      animation: wavePulse 1.6s ease-in-out infinite;
    }

    #waveHud.urgent {
      border-color: rgba(255, 96, 96, 0.72);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.45),
        0 0 34px rgba(255, 96, 96, 0.28);
    }

    @keyframes wavePulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    #waveTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    #waveBadge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    #waveStatus {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      opacity: 0.88;
      text-align: right;
    }

    #waveTrack {
      position: relative;
      height: 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    #waveFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00eaff, #38d976, #ffd86f);
      transition: width 360ms cubic-bezier(0.18, 0.9, 0.2, 1);
      box-shadow: 0 0 18px rgba(0, 234, 255, 0.35);
    }

    #waveTierMark {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
    }

    #waveMeta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.82);
    }

    #waveTimer {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      min-width: 42px;
      text-align: right;
    }

    #waveHud.urgent #waveTimer {
      color: #ff7878;
      animation: timerBlink 0.9s ease-in-out infinite;
    }

    @keyframes timerBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    #waveParticipants {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .waveChip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #card {
      position: relative;
      min-width: min(920px, 92vw);
      padding: 28px 42px 24px;
      border-radius: 28px;
      text-align: center;
      color: #fff;
      opacity: 0;
      transform: scale(0.82) translateY(24px);
      transition: opacity 360ms ease, transform 520ms cubic-bezier(0.18, 0.9, 0.2, 1);
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(160deg, rgba(8,12,24,0.92), rgba(18,28,48,0.88));
      box-shadow: 0 24px 64px rgba(0,0,0,0.55);
    }

    #card.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    #card.spam-flash {
      transform: scale(1.04) translateY(0);
    }

    #badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
    }

    #title {
      font-size: clamp(42px, 6vw, 72px);
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -1px;
      text-shadow: 0 6px 24px rgba(0,0,0,0.55);
    }

    #subtext {
      margin-top: 12px;
      font-size: clamp(18px, 2.2vw, 26px);
      font-weight: 700;
      opacity: 0.88;
    }

    #bossCinematic {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }

    #bossCinematic.visible {
      display: flex;
    }

    #bossCinematic::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 208, 96, 0.28), transparent 52%),
        linear-gradient(180deg, rgba(48, 12, 88, 0.72), rgba(8, 8, 20, 0.35) 55%, transparent 78%);
      animation: bossVeilPulse 2.4s ease-in-out infinite;
    }

    #bossCinematic::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: repeating-linear-gradient(
        115deg,
        transparent 0 28px,
        rgba(255, 214, 111, 0.06) 28px 32px
      );
      animation: bossSweep 6s linear infinite;
    }

    @keyframes bossVeilPulse {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }

    @keyframes bossSweep {
      from { transform: translateX(-8%) rotate(0deg); }
      to { transform: translateX(8%) rotate(0deg); }
    }

    #bossRing {
      position: relative;
      width: min(520px, 72vw);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 3px solid rgba(255, 214, 111, 0.55);
      box-shadow:
        0 0 48px rgba(255, 180, 0, 0.35),
        inset 0 0 36px rgba(255, 208, 96, 0.18);
      animation: bossRingSpin 8s linear infinite;
    }

    #bossRing.mega {
      border-color: rgba(255, 96, 64, 0.62);
      box-shadow:
        0 0 52px rgba(255, 96, 64, 0.38),
        inset 0 0 40px rgba(255, 120, 80, 0.2);
    }

    @keyframes bossRingSpin {
      from { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.04); }
      to { transform: rotate(360deg) scale(1); }
    }

    #card.legend-boss {
      border-width: 3px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 208, 96, 0.22), transparent 48%),
        linear-gradient(160deg, rgba(32, 8, 48, 0.96), rgba(12, 16, 32, 0.92));
      animation: legendCardPulse 1.8s ease-in-out infinite;
    }

    #card.mega-boss {
      border-width: 3px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 96, 64, 0.24), transparent 48%),
        linear-gradient(160deg, rgba(40, 8, 16, 0.96), rgba(16, 12, 24, 0.92));
    }

    @keyframes legendCardPulse {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.02) translateY(-2px); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="waveHud">
      <div id="waveTop">
        <div id="waveBadge">🌊 Dárková vlna</div>
        <div id="waveStatus"></div>
      </div>
      <div id="waveTrack">
        <div id="waveFill"></div>
        <div id="waveTierMark"></div>
      </div>
      <div id="waveMeta">
        <span id="waveMetaText"></span>
        <span id="waveTimer"></span>
      </div>
      <div id="waveParticipants"></div>
    </div>
    <div id="flash"></div>
    <div id="bossCinematic"><div id="bossRing"></div></div>
    <div id="card">
      <div id="badge">COMBO</div>
      <div id="title"></div>
      <div id="subtext"></div>
    </div>
  </div>

  <script src="/assets/combo-wave-ui.js"></script>
  <script>
    const POLL_MS = 400;
    const waveUi = window.MIA_COMBO_WAVE_UI;
    const card = document.getElementById("card");
    const flash = document.getElementById("flash");
    const badge = document.getElementById("badge");
    const title = document.getElementById("title");
    const subtext = document.getElementById("subtext");
    const waveHud = document.getElementById("waveHud");
    const waveStatus = document.getElementById("waveStatus");
    const waveFill = document.getElementById("waveFill");
    const waveTierMark = document.getElementById("waveTierMark");
    const waveMetaText = document.getElementById("waveMetaText");
    const waveTimer = document.getElementById("waveTimer");
    const waveParticipants = document.getElementById("waveParticipants");
    const bossCinematic = document.getElementById("bossCinematic");
    const bossRing = document.getElementById("bossRing");

    let activeMomentId = "";
    let hideTimer = null;
    let lastWaveKey = "";

    function applyAccent(accent, glow) {
      card.style.borderColor = accent;
      card.style.boxShadow = `0 24px 64px rgba(0,0,0,0.55), 0 0 48px ${glow || "rgba(255,180,0,0.35)"}`;
      badge.style.color = accent;
      badge.style.borderColor = accent;
      title.style.color = "#fff";
      flash.style.background = `radial-gradient(circle at 50% 45%, ${glow || "rgba(255,180,0,0.25)"}, transparent 58%)`;
    }

    function showComboMoment(moment) {
      if (!moment || !moment.momentId || moment.momentId === activeMomentId) return;
      activeMomentId = moment.momentId;

      const kind = String(moment.kind || "").toUpperCase();
      const isLegend = kind === "LEGEND";
      const isMegaBoss = kind === "MEGA_BOSS";
      const isAchievement =
        kind === "ACHIEVEMENT" ||
        String(moment.source || "").toLowerCase() === "achievement";
      const spamPresentation =
        typeof waveUi?.resolveSpamMomentPresentation === "function"
          ? waveUi.resolveSpamMomentPresentation(moment)
          : null;

      card.classList.remove("legend-boss", "mega-boss");
      bossCinematic.classList.remove("visible");
      bossRing.classList.remove("mega");

      if (spamPresentation) {
        badge.textContent = spamPresentation.badge;
        applyAccent(spamPresentation.accent, spamPresentation.glow);
        card.classList.add("spam-flash");
      } else if (isAchievement) {
        badge.textContent = "Milník";
        applyAccent(moment.accent || "#ffd86f", moment.glow);
        card.classList.remove("spam-flash");
      } else if (isLegend) {
        badge.textContent = "LEGENDA";
        applyAccent(moment.accent || "#ffd060", moment.glow || "rgba(255,208,96,0.55)");
        card.classList.add("legend-boss");
        card.classList.remove("spam-flash");
        bossRing.classList.remove("mega");
        bossCinematic.classList.add("visible");
      } else if (isMegaBoss) {
        badge.textContent = "MEGA BOSS";
        applyAccent(moment.accent || "#ff6040", moment.glow || "rgba(255,96,64,0.5)");
        card.classList.add("mega-boss");
        card.classList.remove("spam-flash");
        bossRing.classList.add("mega");
        bossCinematic.classList.add("visible");
      } else if (kind === "BOSS") {
        badge.textContent = "BOSS";
        applyAccent(moment.accent || "#ff6040", moment.glow);
        card.classList.remove("spam-flash");
        bossCinematic.classList.add("visible");
      } else {
        badge.textContent = moment.kind || "COMBO";
        applyAccent(moment.accent || "#ffb400", moment.glow);
        card.classList.remove("spam-flash");
      }

      title.textContent = moment.title || (isAchievement ? "Achievement" : "COMBO");
      subtext.textContent = moment.subtext || "";

      flash.classList.add("on");
      card.classList.add("visible");

      if (hideTimer) clearTimeout(hideTimer);
      const holdMs = Math.max(4000, (moment.holdUntilTs || 0) - Date.now());
      hideTimer = setTimeout(() => {
        card.classList.remove("visible");
        card.classList.remove("spam-flash", "legend-boss", "mega-boss");
        bossCinematic.classList.remove("visible");
        flash.classList.remove("on");
      }, holdMs);
    }

    function renderWaveHud(spam) {
      const model =
        typeof waveUi?.buildWaveHudModel === "function"
          ? waveUi.buildWaveHudModel(spam)
          : { visible: false };

      if (!model.visible) {
        waveHud.classList.remove("visible", "confirmed", "pulse", "urgent");
        lastWaveKey = "";
        return;
      }

      const waveKey = [
        model.progressPct,
        model.confirmed,
        model.remainingSec,
        model.eventCount,
        model.participantCount,
        model.nextTier || "",
        model.metaLine
      ].join("|");

      if (waveKey !== lastWaveKey) {
        lastWaveKey = waveKey;
        waveStatus.textContent = model.statusLabel;
        waveFill.style.width = `${model.progressPct}%`;
        waveTierMark.textContent = model.nextTier ? `→ ${model.nextTier}` : "";
        waveMetaText.textContent = model.metaLine;
        waveTimer.textContent = model.remainingSec > 0 ? `${model.remainingSec}s` : "";
        waveHud.style.borderColor = model.confirmed ? "rgba(0,234,255,0.55)" : "rgba(122,215,255,0.28)";
        waveHud.style.boxShadow = model.confirmed
          ? `0 18px 48px rgba(0,0,0,0.45), 0 0 36px ${model.glow}`
          : "0 18px 48px rgba(0,0,0,0.45)";

        waveParticipants.innerHTML = "";
        for (const name of model.participantNames || []) {
          const chip = document.createElement("span");
          chip.className = "waveChip";
          chip.textContent = name;
          waveParticipants.appendChild(chip);
        }
      }

      waveHud.classList.add("visible");
      waveHud.classList.toggle("confirmed", model.confirmed);
      waveHud.classList.toggle("pulse", model.pulse);
      waveHud.classList.toggle("urgent", model.urgent);
    }

    async function poll() {
      try {
        const res = await fetch("/overlay-state", { cache: "no-store" });
        const data = await res.json();
        if (data?.comboMoment) showComboMoment(data.comboMoment);
        renderWaveHud(data?.spamSession);
      } catch (_err) {
        /* ignore */
      }
    }

    setInterval(poll, POLL_MS);
    poll();
  </script>
</body>
</html>
