<!DOCTYPE html>

<html lang="cs">

<head>

  <meta charset="UTF-8" />

  <title>MIA Away Loop</title>

  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #080414;

    }



    #root {

      position: fixed;

      inset: 0;

      background: #080414;

    }



    #bg {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      opacity: 0.92;

      animation: drift 24s ease-in-out infinite alternate;

    }



    #root::after {

      content: "";

      position: absolute;

      inset: 0;

      background:

        radial-gradient(circle at 18% 12%, rgba(176, 124, 255, 0.22), transparent 38%),

        radial-gradient(circle at 82% 22%, rgba(255, 120, 180, 0.14), transparent 36%);

      pointer-events: none;

    }



    @keyframes drift {

      0% { filter: hue-rotate(0deg) brightness(1); transform: scale(1); }

      100% { filter: hue-rotate(18deg) brightness(1.06); transform: scale(1.03); }

    }



    .orb {

      position: absolute;

      border-radius: 50%;

      filter: blur(48px);

      opacity: 0.55;

      animation: float 14s ease-in-out infinite;

    }



    .orb.a {

      width: 420px;

      height: 420px;

      left: 8%;

      top: 18%;

      background: rgba(176, 124, 255, 0.45);

      animation-duration: 18s;

    }



    .orb.b {

      width: 520px;

      height: 520px;

      right: 6%;

      top: 8%;

      background: rgba(255, 140, 200, 0.28);

      animation-duration: 22s;

      animation-delay: -4s;

    }



    .orb.c {

      width: 360px;

      height: 360px;

      left: 42%;

      bottom: 6%;

      background: rgba(80, 200, 255, 0.22);

      animation-duration: 16s;

      animation-delay: -8s;

    }



    @keyframes float {

      0%, 100% { transform: translate(0, 0) scale(1); }

      33% { transform: translate(28px, -18px) scale(1.06); }

      66% { transform: translate(-22px, 24px) scale(0.96); }

    }



    #grid {

      position: absolute;

      inset: -20%;

      background-image:

        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),

        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);

      background-size: 64px 64px;

      transform: perspective(600px) rotateX(58deg);

      transform-origin: center 80%;

      opacity: 0.35;

      animation: gridMove 20s linear infinite;

    }



    @keyframes gridMove {

      from { background-position: 0 0; }

      to { background-position: 0 128px; }

    }



    #mark {

      position: absolute;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -50%);

      text-align: center;

      color: rgba(255, 255, 255, 0.14);

      font-family: "Segoe UI", system-ui, sans-serif;

      letter-spacing: 0.35em;

      text-transform: uppercase;

      font-weight: 900;

      font-size: clamp(28px, 4vw, 52px);

      user-select: none;

      pointer-events: none;

    }



    #mark small {

      display: block;

      margin-top: 12px;

      font-size: clamp(11px, 1.2vw, 14px);

      letter-spacing: 0.55em;

      opacity: 0.7;

    }



    #gfxHint {

      display: none;

      position: absolute;

      left: 12px;

      right: 12px;

      bottom: 12px;

      padding: 10px 14px;

      border-radius: 12px;

      background: rgba(8, 6, 16, 0.82);

      border: 1px solid rgba(255, 255, 255, 0.12);

      color: rgba(255, 255, 255, 0.78);

      font-family: "Segoe UI", system-ui, sans-serif;

      font-size: 12px;

      line-height: 1.45;

      pointer-events: none;

    }



    body.gfx-mode #gfxHint { display: block; }

    body.gfx-mode #mark { color: rgba(255, 255, 255, 0.22); }

    body.gfx-mode .orb { opacity: 0.25; }



    #scan {

      position: absolute;

      inset: 0;

      background: linear-gradient(

        180deg,

        transparent 0%,

        rgba(255, 255, 255, 0.025) 48%,

        transparent 52%

      );

      background-size: 100% 220%;

      animation: scan 6s linear infinite;

      pointer-events: none;

    }



    @keyframes scan {

      from { background-position: 0 -120%; }

      to { background-position: 0 120%; }

    }

  </style>

</head>

<body>

  <div id="root">

    <img id="bg" src="/assets/kojnozrout/away/loop-bg.png" alt="" />

    <div class="orb a"></div>

    <div class="orb b"></div>

    <div class="orb c"></div>

    <div id="grid"></div>

    <div id="mark">NEJSEM TU<small>MIA HOST</small></div>

    <div id="gfxHint"></div>

    <div id="scan"></div>

  </div>

  <script>

    const SCENES = ["den", "cave", "cozy", "feast", "party", "night"];

    const params = new URLSearchParams(location.search);

    const gfxMode = params.get("gfx") === "1";

    const bgEl = document.getElementById("bg");

    const markEl = document.getElementById("mark");

    const hintEl = document.getElementById("gfxHint");

    let sceneIdx = SCENES.indexOf(String(params.get("scene") || "").toLowerCase());



    function sceneLabel(id) {

      return id || "loop-bg";

    }



    function applyFullScene(id) {

      if (id && SCENES.includes(id)) {

        bgEl.src = `/assets/kojnozrout/scenes/scene-${id}.png?v=1`;

      } else {

        bgEl.src = "/assets/kojnozrout/away/loop-bg.png?v=1";

      }

      if (gfxMode) {

        markEl.innerHTML = `GFX · ${sceneLabel(id).toUpperCase()}<small>celoplošné preview · NEJSEM TU</small>`;

        hintEl.textContent = `Scéna: ${sceneLabel(id)} · šipky ← → nebo auto rotace · runtime Koj používá jen tint + malé accent PNG`;

      }

    }



    if (gfxMode) {

      document.body.classList.add("gfx-mode");

      if (sceneIdx < 0) sceneIdx = 0;

      applyFullScene(SCENES[sceneIdx]);

      setInterval(() => {

        sceneIdx = (sceneIdx + 1) % SCENES.length;

        applyFullScene(SCENES[sceneIdx]);

      }, 8000);

      window.addEventListener("keydown", (ev) => {

        if (ev.key === "ArrowRight") {

          sceneIdx = (sceneIdx + 1) % SCENES.length;

          applyFullScene(SCENES[sceneIdx]);

        } else if (ev.key === "ArrowLeft") {

          sceneIdx = (sceneIdx - 1 + SCENES.length) % SCENES.length;

          applyFullScene(SCENES[sceneIdx]);

        }

      });

    }

  </script>

</body>

</html>
