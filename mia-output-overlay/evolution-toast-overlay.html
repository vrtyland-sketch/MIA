<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Evolution Toast</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    #toast {
      position: absolute;
      top: 200px;
      right: 48px;
      min-width: 280px;
      max-width: 420px;
      padding: 18px 20px;
      border-radius: 22px;
      color: #fff;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 214, 111, 0.22), transparent 34%),
        linear-gradient(135deg, rgba(48, 0, 88, 0.94), rgba(0, 0, 0, 0.86));
      border: 1px solid rgba(255, 214, 111, 0.42);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.42),
        0 0 28px rgba(155, 92, 255, 0.22);
      backdrop-filter: blur(12px);
      display: none;
      animation: popIn 420ms ease-out;
    }

    #toast.show {
      display: block;
    }

    #badge {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.45px;
      text-transform: uppercase;
      color: #ffd86f;
      margin-bottom: 8px;
    }

    #title {
      font-size: 24px;
      line-height: 1.1;
      font-weight: 1000;
      margin-bottom: 8px;
    }

    #sub {
      font-size: 14px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.82);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(-12px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="toast">
    <div id="badge">Evoluce Kojnožrouta</div>
    <div id="title"></div>
    <div id="sub"></div>
  </div>

  <script>
    const toast = document.getElementById("toast");
    const badge = document.getElementById("badge");
    const title = document.getElementById("title");
    const sub = document.getElementById("sub");

    let lastKey = "";

    function safeText(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    function pickMoment(snapshot) {
      const state = snapshot?.kojnozoutState || snapshot?.kojnozroutState || {};
      return state?.lastEvolutionMoment || snapshot?.evolutionMoment?.moment || null;
    }

    function render(moment) {
      const until = Number(moment?.until || 0);
      if (!moment || until <= Date.now()) {
        toast.classList.remove("show");
        return;
      }

      const key = `${moment.tier}:${moment.at}:${until}`;
      if (key === lastKey) {
        toast.classList.add("show");
        return;
      }

      lastKey = key;
      badge.textContent = "Evoluce Kojnožrouta";
      title.textContent = safeText(moment.label, "Nová fáze");
      sub.textContent = safeText(
        moment.subtext,
        moment.actor ? `${moment.actor} posunul Kojnožrouta dál.` : "Komunita posunula Kojnožrouta dál."
      );
      toast.classList.add("show");
    }

    async function tick() {
      try {
        const res = await fetch("/overlay-state?_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("overlay-state " + res.status);
        const data = await res.json();
        render(pickMoment(data));
      } catch (_err) {
      }
    }

    tick();
    setInterval(tick, 350);
  </script>
</body>
</html>
