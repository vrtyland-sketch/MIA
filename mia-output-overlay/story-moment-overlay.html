<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIA Story Moment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #root {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 16px;
    }
    #stage {
      width: min(960px, 98vw);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 22px 56px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 420ms ease, transform 520ms cubic-bezier(0.2, 0.9, 0.2, 1);
      background: rgba(8, 12, 24, 0.12);
    }
    #stage.visible {
      opacity: 1;
      transform: scale(1);
    }
    #wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    #visual {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: auto;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.35s ease, transform 2.6s ease-out;
    }
    #visual.show {
      opacity: 1;
      transform: scale(1.05);
    }
    #hud {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 20px 16px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.62));
      color: #fff;
      z-index: 2;
    }
    #title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.45px;
      text-transform: uppercase;
      opacity: 0.88;
      margin-bottom: 4px;
    }
    #caption {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.18;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    #progress {
      margin-top: 10px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      overflow: hidden;
    }
    #progress > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8aff9d, #38d976);
      transition: width 220ms linear;
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="stage">
      <div id="wrap">
        <img id="visual" alt="" />
        <div id="hud">
          <div id="title"></div>
          <div id="caption"></div>
          <div id="progress"><i id="bar"></i></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const POLL_MS = 400;
    const stage = document.getElementById("stage");
    const visual = document.getElementById("visual");
    const titleEl = document.getElementById("title");
    const captionEl = document.getElementById("caption");
    const bar = document.getElementById("bar");

    let activePlaybackId = "";
    let frameTimer = null;
    let hideTimer = null;
    let playing = null;
    const preloadCache = new Map();

    function clearTimers() {
      if (frameTimer) clearTimeout(frameTimer);
      if (hideTimer) clearTimeout(hideTimer);
      frameTimer = null;
      hideTimer = null;
    }

    function preloadFrame(storyVisual, index) {
      const frame = storyVisual.frames?.[index];
      if (!frame?.imageUrl) return;
      const url = frame.imageUrl + (frame.imageUrl.includes("?") ? "&" : "?") + "t=" + storyVisual.updatedAt + "&f=" + index;
      if (preloadCache.has(url)) return;
      const img = new Image();
      img.src = url;
      preloadCache.set(url, img);
    }

    function showFrame(storyVisual, index) {
      const frames = storyVisual.frames || [];
      const frame = frames[index];
      if (!frame) return finish(storyVisual);

      preloadFrame(storyVisual, index + 1);

      const url = frame.imageUrl + (frame.imageUrl.includes("?") ? "&" : "?") + "t=" + storyVisual.updatedAt + "&f=" + index;

      visual.classList.remove("show");
      visual.onload = () => {
        requestAnimationFrame(() => visual.classList.add("show"));
      };
      visual.src = url;
      if (visual.complete) visual.classList.add("show");

      titleEl.textContent = storyVisual.title || "Příběh";
      captionEl.textContent = frame.caption || "";
      bar.style.width = `${Math.round(((index + 1) / frames.length) * 100)}%`;

      const durationMs = Math.max(1800, frame.durationMs || storyVisual.frameMs || 2800);
      frameTimer = setTimeout(() => showFrame(storyVisual, index + 1), durationMs);
    }

    function finish() {
      playing = null;
      stage.classList.remove("visible");
      visual.classList.remove("show");
      activePlaybackId = "";
      clearTimers();
    }

    function playStoryVisual(storyVisual) {
      if (!storyVisual?.frames?.length) return;
      const pid = storyVisual.playbackId || String(storyVisual.updatedAt);
      if (pid === activePlaybackId && playing) return;

      clearTimers();
      activePlaybackId = pid;
      playing = storyVisual;
      preloadFrame(storyVisual, 0);
      stage.classList.add("visible");
      showFrame(storyVisual, 0);

      const holdMs = Math.max(10000, (storyVisual.holdUntilTs || 0) - Date.now());
      hideTimer = setTimeout(finish, holdMs);
    }

    async function poll() {
      try {
        const res = await fetch("/overlay-state", { cache: "no-store" });
        const data = await res.json();
        if (data?.storyVisual?.frames?.length) {
          playStoryVisual(data.storyVisual);
        }
      } catch (_err) {
        /* ignore */
      }
    }

    setInterval(poll, POLL_MS);
    poll();
  </script>
</body>
</html>
