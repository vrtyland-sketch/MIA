<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>MIA Genesis FX</title>
  <style>
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050a12; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<canvas id="fx" width="1080" height="1920"></canvas>
<script>
(function () {
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  const W = 1080;
  const H = 1920;
  const particles = Array.from({ length: 64 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -0.15 - Math.random() * 0.4,
    r: 1 + Math.random() * 2.2,
    a: 0.15 + Math.random() * 0.45
  }));
  const links = Array.from({ length: 12 }, (_, i) => ({
    y: 80 + i * 80 + Math.random() * 40,
    phase: Math.random() * Math.PI * 2,
    speed: 0.4 + Math.random() * 0.6
  }));

  let pulse = 0;
  window.MIA_GENESIS_FX = {
    pulse() { pulse = 1; }
  };

  function frame(t) {
    const sec = t / 1000;
    ctx.fillStyle = "#050a12";
    ctx.fillRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#0b1830");
    g.addColorStop(0.55, "#07101f");
    g.addColorStop(1, "#050a12");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(92,225,255,0.12)";
    ctx.lineWidth = 1;
    for (const link of links) {
      const y = link.y + Math.sin(sec * link.speed + link.phase) * 8;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 40) {
        const yy = y + Math.sin(x * 0.004 + sec * link.speed) * 18;
        if (x === 0) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }

    if (pulse > 0) {
      ctx.fillStyle = `rgba(92,225,255,${0.08 * pulse})`;
      ctx.fillRect(0, 0, W, H);
      pulse = Math.max(0, pulse - 0.02);
    }

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(125,255,179,${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
