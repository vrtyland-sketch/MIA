<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Kojnožrout Duel</title>
<link rel="stylesheet" href="/assets/mia-2d-fx.css?v=1" />
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
#panel{position:absolute;top:36px;left:50%;transform:translateX(-50%);min-width:560px;padding:16px 20px 18px;border-radius:20px;background:rgba(8,0,24,.88);border:1px solid rgba(155,92,255,.35);box-shadow:0 16px 40px rgba(0,0,0,.42);display:none}
#panel.active{display:block}
#title{text-align:center;font-size:13px;font-weight:900;letter-spacing:.35px;text-transform:uppercase;color:#d4b8ff;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.side{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:box-shadow .25s ease,border-color .25s ease}
.side.lead{border-color:rgba(255,214,111,.75);box-shadow:0 0 18px rgba(255,214,111,.12)}
.label{font-size:11px;opacity:.75;text-transform:uppercase;font-weight:900;margin-bottom:6px}
.points{font-size:30px;font-weight:1000;line-height:1}
.vs{font-size:22px;font-weight:1000;color:#ffd86f}
#barWrap{margin-top:14px;padding:0 2px}
#bar{position:relative;height:18px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
#barLocal{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#7b5cff,#00eaff);transition:width .45s ease;box-shadow:0 0 16px rgba(0,234,255,.25)}
#barOpponent{position:absolute;right:0;top:0;bottom:0;width:50%;background:linear-gradient(270deg,#ff5d7a,#ffb400);transition:width .45s ease;box-shadow:0 0 16px rgba(255,93,122,.18)}
#barPct{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:900;opacity:.82}
#breakdown{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:10px;opacity:.72}
.break{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
#timer{text-align:center;margin-top:10px;font-size:14px;font-weight:900;color:#9ff8ff}
#sub{text-align:center;margin-top:6px;font-size:12px;opacity:.78}
#itemToast{position:absolute;top:8px;left:50%;transform:translateX(-50%) translateY(-8px);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(20,0,40,.92);border:1px solid rgba(180,90,255,.45);font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:5}
#itemToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#itemToast img{width:28px;height:28px;object-fit:contain}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<div id="panel">
  <div id="itemToast"><img id="itemToastIcon" alt="" /><span id="itemToastText"></span></div>
  <div id="title">Duel Kojnožroutů</div>
  <div class="row">
    <div id="local" class="side">
      <div class="label" id="localLabel">My</div>
      <div class="points" id="localPoints">0</div>
    </div>
    <div class="vs">VS</div>
    <div id="opponent" class="side">
      <div class="label" id="opponentLabel">Soupeř</div>
      <div class="points" id="opponentPoints">0</div>
    </div>
  </div>
  <div id="barWrap">
    <div id="bar">
      <div id="barLocal"></div>
      <div id="barOpponent"></div>
    </div>
    <div id="barPct">
      <span id="localPct">50%</span>
      <span id="opponentPct">50%</span>
    </div>
  </div>
  <div id="breakdown">
    <div class="break" id="localBreak">gift 0 · chat 0 · like 0</div>
    <div class="break" id="opponentBreak">gift 0 · chat 0 · like 0</div>
  </div>
  <div id="timer">--:--</div>
  <div id="sub">Závod o MIA body · ne deathmatch</div>
</div>
<script src="/assets/mia-2d-fx.js?v=1"></script>
<script src="/assets/koj-battle-fx.js?v=1"></script>
<script>
const API = window.location.origin || "http://127.0.0.1:3000";
const FX = window.MIA_2D_FX || window.MIA_KOJ_BATTLE_FX;
const panel = document.getElementById("panel");
const localEl = document.getElementById("local");
const opponentEl = document.getElementById("opponent");
const itemToast = document.getElementById("itemToast");
const itemToastIcon = document.getElementById("itemToastIcon");
const itemToastText = document.getElementById("itemToastText");
const fxHost = document.getElementById("fx");
let lastSig = "";
let lastItemToken = "";

function fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function breakdown(side) {
  return `gift ${side?.giftPoints ?? 0} · chat ${side?.chatPoints ?? 0} · like ${side?.likePoints ?? 0} · follow ${side?.followPoints ?? 0} · share ${side?.sharePoints ?? 0}`;
}

function syncItemUse(data, now) {
  const duel = data?.duel;
  if (!duel?.active) return;

  const use = data?.kojDisplay?.itemUse?.active
    ? data.kojDisplay.itemUse
    : data?.backpack?.display?.lastUseSummary;
  if (!use?.itemId || !use?.holdUntil || use.holdUntil <= now) return;
  if (!use.duelActive) return;

  const token = `${use.at}:${use.itemId}`;
  if (token === lastItemToken) return;
  lastItemToken = token;

  const projectile = FX?.resolveProjectileKind
    ? FX.resolveProjectileKind(use)
    : (use.effect?.projectile || "orb");

  itemToastIcon.src = `${API}/assets/kojnozrout/items/${use.itemId}.png?v=4`;
  itemToastText.textContent = `${use.itemLabel || use.itemId} · +${use.power || "?"}`;
  itemToast.classList.add("show");
  setTimeout(() => itemToast.classList.remove("show"), 2400);

  if (FX?.spawnDuelItemBurst) {
    FX.spawnDuelItemBurst(fxHost, projectile, "#9b5cff", API, "local");
  }
}

function render(duel, data, now) {
  if (!duel || !duel.active) {
    panel.classList.remove("active");
    return;
  }
  const sig = JSON.stringify(duel);
  if (sig !== lastSig) {
    lastSig = sig;
    document.getElementById("localLabel").textContent = duel.local?.label || "My";
    document.getElementById("opponentLabel").textContent = duel.opponent?.label || "Soupeř";
    document.getElementById("localPoints").textContent = String(duel.local?.miaPoints ?? 0);
    document.getElementById("opponentPoints").textContent = String(duel.opponent?.miaPoints ?? 0);
    document.getElementById("timer").textContent = `Zbývá ${fmt(duel.remainingSec || 0)}`;
    localEl.classList.toggle("lead", duel.lead === "local");
    opponentEl.classList.toggle("lead", duel.lead === "opponent");
    document.getElementById("sub").textContent =
      duel.lead === "tie"
        ? "Remíza · každý gift/chat/like/follow/share přidává body týmu"
        : "Kdo nahraje víc MIA bodů, vyhrává";

    const localPct = duel.powerBar?.localPct ?? 50;
    const opponentPct = duel.powerBar?.opponentPct ?? 50;
    document.getElementById("barLocal").style.width = `${localPct}%`;
    document.getElementById("barOpponent").style.width = `${opponentPct}%`;
    document.getElementById("localPct").textContent = `${localPct}%`;
    document.getElementById("opponentPct").textContent = `${opponentPct}%`;
    document.getElementById("localBreak").textContent = breakdown(duel.local);
    document.getElementById("opponentBreak").textContent = breakdown(duel.opponent);
  }
  panel.classList.add("active");
  syncItemUse(data, now);
}

let pollInFlight = false;
let pollFailStreak = 0;
const POLL_MS = 400;
const POLL_BACKOFF_MS = 2000;

async function tick() {
  if (pollInFlight) return;
  pollInFlight = true;
  try {
    const now = Date.now();
    const res = await fetch("/overlay-state?_=" + now, { cache: "no-store" });
    if (!res.ok) throw new Error("overlay-state");
    const data = await res.json();
    render(data?.duel || null, data, now);
    pollFailStreak = 0;
  } catch (_e) {
    pollFailStreak += 1;
  } finally {
    pollInFlight = false;
  }
}

function schedulePoll() {
  const delay = pollFailStreak > 0
    ? Math.min(POLL_BACKOFF_MS * pollFailStreak, 8000)
    : POLL_MS;
  setTimeout(async () => {
    await tick();
    schedulePoll();
  }, delay);
}

schedulePoll();
</script>
</body>
</html>
