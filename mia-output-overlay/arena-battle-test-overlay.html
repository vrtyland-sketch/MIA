<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>MIA · Battle Test (OBS)</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Segoe UI", Arial Black, sans-serif; color: #fff;
  }
  #stage {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,4,14,.55), rgba(6,4,14,.88));
    display: flex; flex-direction: column;
  }
  #head {
    padding: 10px 14px 6px;
    background: rgba(8,4,16,.92);
    border-bottom: 2px solid gold;
    text-align: center;
  }
  #head h1 { margin: 0; font-size: 18px; letter-spacing: .08em; }
  #head p { margin: 4px 0 0; font-size: 11px; opacity: .85; font-weight: 600; }
  #move {
    margin: 8px 12px 0;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.72);
    border: 1px solid rgba(255,208,96,.45);
    font-size: 13px; font-weight: 800; text-align: center;
    min-height: 18px;
  }
  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 8px 12px 12px;
  }
  .cell {
    position: relative;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,.14);
    background: rgba(10,8,18,.86);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    transition: box-shadow .2s, transform .15s;
  }
  .cell.attacker { box-shadow: 0 0 0 2px gold, 0 0 24px rgba(255,208,96,.25); transform: scale(1.02); }
  .cell.target { box-shadow: 0 0 0 2px #ff6b4a; animation: hitShake .32s ease; }
  .cell img {
    width: 72%; max-height: 68%;
    object-fit: contain;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.55));
    transition: transform .2s ease, filter .2s;
  }
  .cell.pose-attack img { transform: scale(1.08) rotate(-6deg); filter: drop-shadow(0 0 16px rgba(255,96,64,.5)); }
  .cell.pose-hit img { transform: scale(.94) rotate(8deg); opacity: .9; }
  .cell.pose-buff img { filter: brightness(1.12) drop-shadow(0 0 14px rgba(120,255,160,.35)); }
  .meta {
    width: 100%; padding: 6px 8px 8px;
    text-align: center; background: rgba(0,0,0,.45);
  }
  .name { font-size: 12px; font-weight: 900; }
  .pose { font-size: 9px; opacity: .8; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
  .pts { font-size: 11px; font-weight: 800; margin-top: 2px; color: #ffe066; }
  #foot {
    padding: 6px 12px 10px;
    font-size: 10px; text-align: center; opacity: .75;
  }
  @keyframes hitShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="head">
    <h1>BATTLE TEST · 4 KOJNOŽROUTI</h1>
    <p>Tokžrout · Stackžrout · Bitsžrout · Kisstube — live z /arena/status</p>
  </div>
  <div id="move">Čekám na demo…</div>
  <div id="grid"></div>
  <div id="foot">Spusť: npm run battle:demo · OBS Browser Source tato URL</div>
</div>
<script src="/assets/koj-battle-fx.js"></script>
<script>
const API = (location.origin && location.protocol.startsWith("http")) ? location.origin : "http://127.0.0.1:3000";
const ORDER = ["tiktok", "kick", "twitch", "youtube"];
const LABELS = { tiktok: "Tokžrout", kick: "Stackžrout", twitch: "Bitsžrout", youtube: "Kisstube" };
const ACCENTS = { tiktok: "#00f2ea", kick: "#53fc18", twitch: "#9146ff", youtube: "#e6007e" };

function poseClass(pose) {
  const p = String(pose || "idle").toLowerCase();
  if (p.startsWith("attack") || p === "item_box") return "pose-attack";
  if (p.startsWith("hit")) return "pose-hit";
  if (p === "item_buff" || p === "item_heal" || p === "win") return "pose-buff";
  return "";
}

function render(data) {
  const arena = data.arena || {};
  const battle = arena.battle || {};
  const sprites = battle.sprites || {};
  const current = battle.current || null;
  const ranking = (arena.duel?.ranking || arena.tournament?.ranking || arena.platforms || [])
    .reduce((m, r) => {
      const id = r.platform || r.id;
      if (id) m[id] = r;
      return m;
    }, {});

  const grid = document.getElementById("grid");
  grid.innerHTML = ORDER.map((id) => {
    const spr = sprites[id] || {};
    const pose = spr.pose || "idle";
    const row = ranking[id] || {};
    const pts = Math.round(Number(row.points ?? row.miaPoints ?? 0));
    const isAttacker = current?.attacker === id;
    const isTarget = (current?.targets || []).includes(id);
    const cls = [poseClass(pose), isAttacker ? "attacker" : "", isTarget ? "target" : ""].filter(Boolean).join(" ");
    const src = spr.spriteUrl || spr.idleUrl || `/assets/kojnozrout/forms/${id}/idle.png`;
    return `<div class="cell ${cls}" style="border-top: 3px solid ${ACCENTS[id] || '#fff'}">
      <img src="${API}${src}" alt="${LABELS[id]}" />
      <div class="meta">
        <div class="name">${LABELS[id]}</div>
        <div class="pose">${pose.replace(/_/g, " ")}</div>
        <div class="pts">${pts} MIA bodů</div>
      </div>
    </div>`;
  }).join("");

  const moveEl = document.getElementById("move");
  if (current?.text) {
    moveEl.textContent = current.text;
  } else if (arena.duel?.active) {
    const sec = Math.ceil((arena.duel.remainingMs || 0) / 1000);
    moveEl.textContent = `Duel běží · ${sec}s · čekám na akci…`;
  } else {
    moveEl.textContent = "Demo neaktivní — npm run battle:demo";
  }
}

async function tick() {
  try {
    const res = await fetch(API + "/arena/status");
    const data = await res.json();
    if (data?.ok) render(data);
  } catch (_e) {
    document.getElementById("move").textContent = "MIA offline";
  }
}
tick();
setInterval(tick, 800);
</script>
</body>
</html>
