<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIA Body Part</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: block;
      background: transparent;
    }
    #sprite,
    #spriteB {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
      opacity: 0;
      filter: drop-shadow(0 0 14px rgba(0, 220, 255, 0.28));
      transition: opacity 300ms ease, transform 300ms ease;
      pointer-events: none;
      user-select: none;
    }
    #sprite.on,
    #spriteB.on {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img id="sprite" alt="" decoding="async" draggable="false" />
    <img id="spriteB" alt="" decoding="async" draggable="false" />
  </div>
  <script src="lib/mia-live-lip.js"></script>
  <script src="lib/mia-live-presence.js?v=36-koj-unify"></script>
  <script src="lib/mia-body-part-runtime.js"></script>
</body>
</html>
