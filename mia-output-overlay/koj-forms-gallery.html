<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<title>MIA · Form animace</title>
<style>
  html, body { margin: 0; background: #07060c; color: #f2ebff; font-family: "Segoe UI", Arial, sans-serif; }
  h1 { text-align: center; margin: 14px; font-size: 20px; }
  h2 { margin: 18px 14px 8px; font-size: 14px; color: #b9a8c9; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 0 12px 16px; }
  .cell { background: #120e1a; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; overflow: hidden; text-align: center; }
  .cell img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #000; display: block; }
  .cell span { display: block; font-size: 10px; padding: 4px; color: #cbbfe0; }
</style>
</head>
<body>
<h1>Kompletní sady animací žroutů</h1>
<div id="root"></div>
<script>
const API = location.origin.startsWith("http") ? location.origin : "http://127.0.0.1:3000";
const forms = ["tiktok", "kick", "twitch", "youtube"];
const names = { tiktok: "Tokžrout", kick: "Stackžrout", twitch: "Bitsžrout", youtube: "Kisstube" };
const anims = [
  "idle","happy","warm","love","excited","laugh","hungry","full","sleepy","sick","sad",
  "annoyed","stressed","curious","proud","attack","attack2","hit","hit2","win","faint",
  "defend","item_box","item_heal","item_buff","hop","wave","lean_left","lean_right","taunt"
];
const root = document.getElementById("root");
for (const f of forms) {
  const h = document.createElement("h2");
  h.textContent = names[f] + " · " + f;
  root.appendChild(h);
  const row = document.createElement("div");
  row.className = "row";
  for (const a of anims) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<img src="${API}/assets/kojnozrout/forms/${f}/${a}.png?v=5" alt="${a}" loading="lazy" /><span>${a}</span>`;
    row.appendChild(cell);
  }
  root.appendChild(row);
}
</script>
</body>
</html>
