<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<title>Kisstube · náhled Koje</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 30% 20%, #3a0a22, #12060e 70%);
    color: #ffe6f3;
    font-family: "Segoe UI", Arial, sans-serif;
    display: grid;
    place-items: center;
  }
  .card {
    width: min(420px, 92vw);
    background: rgba(20, 6, 14, 0.88);
    border: 1px solid rgba(230, 0, 126, 0.45);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 0 40px rgba(230, 0, 126, 0.25);
    text-align: center;
  }
  img {
    width: min(320px, 80vw);
    height: auto;
    border-radius: 18px;
    border: 2px solid rgba(255, 141, 199, 0.7);
  }
  h1 { margin: 12px 0 4px; font-size: 28px; }
  p { margin: 6px 0; color: #ffb6d9; font-size: 14px; line-height: 1.45; }
  .note { font-size: 12px; color: #c99; opacity: 0.9; }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/kojnozrout/kisstube/koj-kisstube-preview.png" alt="Kisstube Kojnozrout" />
    <h1>Kisstube</h1>
    <p>Kojnozrout zastupuje <strong>Patrika Hezuckého</strong></p>
    <p>MIA zastupuje <strong>Barboru Tlučhořovou</strong></p>
    <p><strong>Radio Kiss</strong> = motiv jen pro <strong>YouTube / Kisstube</strong></p>
    <p class="note">Na TikTok, Kick a Twitch běží běžná MIA + Koj — bez Kiss identity. Pocta diskrétně.</p>
  </div>
</body>
</html>
