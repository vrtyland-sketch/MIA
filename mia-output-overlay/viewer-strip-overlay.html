<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Viewer Strip</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    #strip {
      position: absolute;
      left: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      max-width: calc(100% - 56px);
      overflow: hidden;
    }

    .avatar {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      flex: 0 0 auto;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(155, 92, 255, 0.85), rgba(0, 234, 255, 0.75));
      border: 2px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar.gift {
      border-color: rgba(255, 214, 111, 0.95);
      box-shadow: 0 0 0 2px rgba(255, 214, 111, 0.18);
    }

    .avatar.gift::after {
      content: attr(data-tier);
      position: absolute;
      right: -4px;
      bottom: -5px;
      min-width: 18px;
      padding: 1px 4px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      color: #111;
      background: rgba(255, 214, 111, 0.95);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    .avatar.gift.no-tier::after {
      content: "🎁";
      background: transparent;
      color: inherit;
      min-width: 0;
      padding: 0;
    }

    .avatar.tiktok { border-color: rgba(255, 45, 85, 0.55); }
    .avatar.kick { border-color: rgba(0, 255, 102, 0.55); }

    .label {
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="strip"></div>

  <script>
    const strip = document.getElementById("strip");
    let lastSignature = "";

    function safeText(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    function initials(name) {
      const parts = safeText(name, "?").split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2);
      return `${parts[0][0] || ""}${parts[1][0] || ""}`;
    }

    const DEFAULT_AVATAR = "/assets/kojnozrout/viewers/default-follower.png";

    function normalizeParticipants(list) {
      if (!Array.isArray(list)) return [];

      return list
        .filter(Boolean)
        .map((item) => ({
          user: safeText(item.user || item.userLabel, "Chat"),
          avatarUrl: safeText(item.avatarUrl),
          type: safeText(item.type, "chat").toLowerCase(),
          platform: safeText(item.platform, "unknown").toLowerCase(),
          giftName: safeText(item.giftName),
          giftCount: Number(item.giftCount || 1),
          tier: safeText(item.tier).toUpperCase(),
          ts: Number(item.ts || 0)
        }))
        .slice(0, 8);
    }

    function buildSignature(list) {
      return JSON.stringify(
        list.map((item) => ({
          u: item.user,
          a: item.avatarUrl,
          t: item.type,
          p: item.platform
        }))
      );
    }

    function render(list) {
      strip.innerHTML = "";

      if (list.length === 0) {
        strip.style.display = "none";
        return;
      }

      strip.style.display = "flex";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "Právě tady";
      strip.appendChild(label);

      for (const item of list) {
        const el = document.createElement("div");
        const tier = item.tier && /^T[1-6]$/.test(item.tier) ? item.tier : "";
        el.className = `avatar ${item.type}${item.type !== "gift" ? ` ${item.platform}` : ""}${item.type === "gift" && !tier ? " no-tier" : ""}`;
        if (tier) {
          el.setAttribute("data-tier", tier);
        }
        el.title = item.type === "gift" && item.giftName
          ? `${item.user} · ${item.giftName}${tier ? " · " + tier : ""}${item.giftCount > 1 ? " ×" + item.giftCount : ""}`
          : item.user;

        const avatarUrl = item.avatarUrl || DEFAULT_AVATAR;
        if (avatarUrl) {
          const img = document.createElement("img");
          img.src = avatarUrl;
          img.alt = item.user;
          img.referrerPolicy = "no-referrer";
          img.loading = "lazy";
          img.onerror = () => {
            if (avatarUrl !== DEFAULT_AVATAR) {
              img.src = DEFAULT_AVATAR;
              return;
            }
            img.remove();
            el.textContent = initials(item.user);
          };
          el.appendChild(img);
        } else {
          el.textContent = initials(item.user);
        }

        strip.appendChild(el);
      }
    }

    async function tick() {
      try {
        const res = await fetch("/overlay-state?_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("overlay-state " + res.status);

        const data = await res.json();
        const participants = normalizeParticipants(data?.recentParticipants || []);
        const signature = buildSignature(participants);

        if (signature !== lastSignature) {
          lastSignature = signature;
          render(participants);
        }
      } catch (_err) {
      }
    }

    tick();
    setInterval(tick, 450);
  </script>
</body>
</html>
