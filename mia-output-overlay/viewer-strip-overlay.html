<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Viewer Strip</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Exo 2", "Segoe UI", sans-serif;
    }

    #strip {
      position: absolute;
      left: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(4, 18, 24, 0.62);
      border: 1px solid rgba(120, 255, 220, 0.22);
      backdrop-filter: blur(10px);
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.32),
        0 0 18px rgba(100, 235, 200, 0.1);
      max-width: calc(100% - 56px);
      overflow: hidden;
      transition: opacity 280ms ease, visibility 280ms ease;
    }

    #strip.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .avatar {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex: 0 0 auto;
      overflow: hidden;
      background: linear-gradient(160deg, rgba(42, 74, 82, 0.95), rgba(18, 32, 40, 0.98));
      border: 1.5px solid rgba(120, 255, 220, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8fffa;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      display: block;
    }

    .avatar.gift {
      border-color: rgba(255, 208, 96, 0.72);
      box-shadow: 0 0 0 1px rgba(255, 208, 96, 0.28);
    }

    .avatar.gift::after {
      content: attr(data-tier);
      position: absolute;
      right: -3px;
      bottom: -4px;
      min-width: 16px;
      padding: 1px 3px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      color: #111;
      background: rgba(255, 208, 96, 0.95);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    .avatar.gift.no-tier::after {
      content: "🎁";
      background: transparent;
      color: inherit;
      min-width: 0;
      padding: 0;
    }

    .avatar.tiktok { border-color: rgba(255, 45, 85, 0.45); }
    .avatar.kick { border-color: rgba(0, 255, 102, 0.45); }

    .label {
      color: rgba(200, 245, 235, 0.78);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 2px;
    }
  </style>
</head>
<body>
  <div id="strip"></div>

  <script>
    const strip = document.getElementById("strip");
    let lastSignature = "";

    function safeText(value, fallback = "") {
      return typeof value === "string" && value.trim() ? value.trim() : fallback;
    }

    function toNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function isMomentLive(moment, now = Date.now()) {
      if (!moment || typeof moment !== "object") return false;
      const holdUntil = toNumber(moment.holdUntilTs || moment.expiresAt || moment.until, 0);
      if (holdUntil > 0) return holdUntil > now;
      return Boolean(moment.active);
    }

    function overlayHasSpeechText(overlay, now = Date.now()) {
      if (!overlay || typeof overlay !== "object") return false;
      const text = safeText(overlay.text || overlay.overlay_text || overlay.speech_text);
      if (!text) return false;
      const holdUntil = toNumber(overlay.holdUntilTs, 0);
      return holdUntil === 0 || holdUntil > now;
    }

    function shouldHideStrip(data, now = Date.now()) {
      if (data?.kojDisplay?.celebrationFocus === true) return true;
      if (isMomentLive(data?.storyVisual, now)) return true;
      if (isMomentLive(data?.giftVisual, now)) return true;
      const vp = data?.voicePlayback;
      if (vp && safeText(vp.textPreview || vp.translated)) {
        if (toNumber(vp.holdUntilTs, 0) > now) return true;
        if (toNumber(vp.updatedAt, 0) > 0 && now - toNumber(vp.updatedAt, 0) < 12000) return true;
      }
      if (overlayHasSpeechText(data?.miaOverlay, now)) return true;
      if (overlayHasSpeechText(data?.kojnozoutOverlay, now)) return true;
      if (overlayHasSpeechText(data?.kojnozroutOverlay, now)) return true;
      const combo = data?.comboMoment;
      if (isMomentLive(combo, now)) {
        const kind = safeText(combo.kind).toUpperCase();
        const source = safeText(combo.source).toLowerCase();
        if (
          kind === "SPAM_MILESTONE" ||
          kind === "ACHIEVEMENT" ||
          source === "achievement" ||
          source === "spam_reward"
        ) {
          return true;
        }
      }
      return false;
    }

    function initials(name) {
      const parts = safeText(name, "?").split(/\s+/).filter(Boolean);
      if (parts.length === 0) return "?";
      if (parts.length === 1) return parts[0].slice(0, 2);
      return `${parts[0][0] || ""}${parts[1][0] || ""}`;
    }

    const DEFAULT_AVATAR = "/assets/kojnozrout/viewers/default-follower.png";

    function normalizeParticipants(list) {
      if (!Array.isArray(list)) return [];

      return list
        .filter(Boolean)
        .map((item) => ({
          user: safeText(item.user || item.userLabel, "Chat"),
          avatarUrl: safeText(item.avatarUrl),
          type: safeText(item.type, "chat").toLowerCase(),
          platform: safeText(item.platform, "unknown").toLowerCase(),
          giftName: safeText(item.giftName),
          giftCount: Number(item.giftCount || 1),
          tier: safeText(item.tier).toUpperCase(),
          ts: Number(item.ts || 0)
        }))
        .slice(0, 6);
    }

    function buildSignature(list, hidden) {
      return JSON.stringify({ hidden, list: list.map((item) => ({
        u: item.user,
        a: item.avatarUrl,
        t: item.type,
        p: item.platform
      })) });
    }

    function render(list) {
      strip.innerHTML = "";

      if (list.length === 0) {
        strip.style.display = "none";
        return;
      }

      strip.style.display = "flex";

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = "Právě tady";
      strip.appendChild(label);

      for (const item of list) {
        const el = document.createElement("div");
        const tier = item.tier && /^T[1-6]$/.test(item.tier) ? item.tier : "";
        el.className = `avatar ${item.type}${item.type !== "gift" ? ` ${item.platform}` : ""}${item.type === "gift" && !tier ? " no-tier" : ""}`;
        if (tier) {
          el.setAttribute("data-tier", tier);
        }
        el.title = item.type === "gift" && item.giftName
          ? `${item.user} · ${item.giftName}${tier ? " · " + tier : ""}${item.giftCount > 1 ? " ×" + item.giftCount : ""}`
          : item.user;

        const avatarUrl = item.avatarUrl || DEFAULT_AVATAR;
        if (avatarUrl) {
          const img = document.createElement("img");
          img.src = avatarUrl;
          img.alt = item.user;
          img.referrerPolicy = "no-referrer";
          img.loading = "lazy";
          img.decoding = "async";
          img.onerror = () => {
            if (avatarUrl !== DEFAULT_AVATAR) {
              img.src = DEFAULT_AVATAR;
              return;
            }
            img.remove();
            el.textContent = initials(item.user);
          };
          el.appendChild(img);
        } else {
          el.textContent = initials(item.user);
        }

        strip.appendChild(el);
      }
    }

    async function tick() {
      try {
        const now = Date.now();
        const res = await fetch("/overlay-state?_=" + now, { cache: "no-store" });
        if (!res.ok) throw new Error("overlay-state " + res.status);

        const data = await res.json();
        const hidden = shouldHideStrip(data, now);
        strip.classList.toggle("hidden", hidden);
        if (hidden) {
          if (lastSignature !== "__hidden__") {
            lastSignature = "__hidden__";
            strip.innerHTML = "";
            strip.style.display = "none";
          }
          return;
        }

        const participants = normalizeParticipants(data?.recentParticipants || []);
        const signature = buildSignature(participants, false);

        if (signature !== lastSignature) {
          lastSignature = signature;
          render(participants);
        }
      } catch (_err) {
      }
    }

    tick();
    setInterval(tick, 450);
  </script>
</body>
</html>
