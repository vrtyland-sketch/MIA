<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Kojnožrout Bowl</title>
<script src="/assets/kojnozrout/mood-emoji.js"></script>
<link rel="stylesheet" href="/tiktok-viewer-zones.css?v=36-koj-unify" />
<link rel="stylesheet" href="/mia-soft-neon-world.css?v=36-koj-unify" />
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: "Exo 2", "Segoe UI", Arial, Helvetica, sans-serif;
}

#panel {
  box-sizing: border-box;
  position: absolute;
  top: var(--tt-safe-top, 0);
  right: var(--tt-safe-right, 0);
  left: auto;
  width: min(100%, 280px);
  max-height: calc(100% - var(--tt-safe-top, 0px) - var(--tt-pad, 8px));
  padding: 14px 16px 12px;
  border-radius: 18px;
  background: var(--sn-glass-bg, rgba(6, 28, 30, 0.92));
  border: 1px solid var(--sn-glass-border, rgba(120, 235, 190, 0.34));
  color: #f2fffb;
  box-shadow: var(--sn-glass-glow,
    0 10px 26px rgba(0, 0, 0, 0.38),
    0 0 22px rgba(100, 230, 180, 0.14));
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 8px;
  transition: border-color 0.35s ease, box-shadow 0.35s ease;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

#panel.hungry { border-color: rgba(255, 180, 80, 0.55); box-shadow: 0 10px 26px rgba(255, 140, 40, 0.15); }
#panel.full { border-color: rgba(100, 235, 200, 0.65); box-shadow: 0 0 24px rgba(100, 235, 200, 0.22); }
#panel.eating { border-color: rgba(255, 200, 120, 0.6); animation: bowlPulse 1.2s ease-in-out infinite; }
#panel.celebrate { border-color: rgba(255, 214, 80, 0.75); box-shadow: 0 10px 30px rgba(255, 200, 60, 0.22); }
#panel.gift { border-color: rgba(100, 235, 200, 0.7); }
#panel.combo { border-color: rgba(255, 180, 0, 0.75); box-shadow: 0 10px 30px rgba(255, 180, 0, 0.2); }
#panel.duel { border-color: rgba(255, 100, 100, 0.65); }
#panel.sleepy { border-color: rgba(120, 190, 255, 0.45); }
#panel.sick { border-color: rgba(255, 120, 120, 0.5); }
#panel.sad { border-color: rgba(120, 190, 255, 0.5); }

#headerRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

#tierRow {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

#tierIcon {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  object-fit: contain;
  image-rendering: pixelated;
  display: none;
}

#tierIcon.visible {
  display: block;
}

.label {
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.35px;
  color: rgba(180, 255, 230, 0.72);
  text-transform: uppercase;
  line-height: 1.3;
}

#moodBadge {
  font-size: 18px;
  line-height: 1;
  flex-shrink: 0;
}

#pct {
  font-size: clamp(28px, 16vw, 36px);
  font-weight: 900;
  line-height: 1.05;
  min-height: 1.05em;
  letter-spacing: -0.5px;
  text-shadow: 0 0 12px rgba(100, 235, 200, 0.25);
}

.track {
  height: 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.25);
}

#fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #64ebc8, #50d2ff);
  transition: width 0.35s ease, background 0.35s ease;
  box-shadow: 0 0 10px rgba(100, 235, 200, 0.45);
}

#panel.hungry #fill { background: linear-gradient(90deg, #ffb347, #ff8c42); }
#panel.full #fill, #panel.celebrate #fill { background: linear-gradient(90deg, #64ebc8, #8aff9d); }
#panel.eating #fill { background: linear-gradient(90deg, #ffd27a, #ff9f43); }
#panel.combo #fill { background: linear-gradient(90deg, #ffd166, #ffb703); }

#meta {
  font-size: 11px;
  line-height: 1.35;
  color: rgba(200, 255, 235, 0.78);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#tier {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.25px;
  text-transform: uppercase;
  color: rgba(160, 245, 220, 0.88);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

@keyframes bowlPulse {
  0%, 100% { box-shadow: 0 10px 26px rgba(255, 160, 60, 0.12); }
  50% { box-shadow: 0 10px 32px rgba(255, 160, 60, 0.28); }
}
</style>
</head>
<body>

<aside id="panel" aria-label="Miska Kojnožrout">
  <div id="headerRow">
    <div class="label">Miska Kojnožrout</div>
    <div id="moodBadge" aria-hidden="true">🥣</div>
  </div>
  <div id="pct">0 %</div>
  <div class="track"><div id="fill"></div></div>
  <div id="meta">Čekám…</div>
  <div id="tierRow">
    <img id="tierIcon" alt="" />
    <div id="tier">Vejíčko</div>
  </div>
</aside>

<script>
const API_BASE = (window.location.origin && window.location.protocol.startsWith("http"))
  ? window.location.origin
  : "http://127.0.0.1:3000";

const POLL_MS = 800;
const POLL_BACKOFF_MS = 2500;
let pollInFlight = false;
let pollFailStreak = 0;
const panel = document.getElementById("panel");
const moodBadge = document.getElementById("moodBadge");
const pctEl = document.getElementById("pct");
const fillEl = document.getElementById("fill");
const metaEl = document.getElementById("meta");
const tierEl = document.getElementById("tier");
const tierIconEl = document.getElementById("tierIcon");

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function safe(v, fb = "") { return typeof v === "string" && v.trim() ? v.trim() : fb; }

const MOOD_EMOJI = {
  idle: "🐣", warm: "😊", happy: "😄", hungry: "🍽️", excited: "🤩", eating: "😋", full: "🫃",
  sleepy: "😴", sick: "🤢", sad: "😢", annoyed: "😤", laugh: "😂", stressed: "😰",
  watch: "👀", groove: "🕺", dance: "💃", party: "🥳", celebrate: "🎉", gift: "🎁",
  thanks: "🙏", combo: "⚡", duel: "⚔️", cheer: "📣", hype: "🔥", calm: "😌", cozy: "☕"
};

function moodEmojiFor(kojDisplay) {
  if (safe(kojDisplay?.moodEmoji)) return safe(kojDisplay.moodEmoji);
  const asset = safe(kojDisplay?.spriteAsset, "idle").toLowerCase();
  const mood = safe(kojDisplay?.mood, "idle").toLowerCase();
  if (typeof window.resolveKojMoodEmoji === "function") {
    return window.resolveKojMoodEmoji(asset) || window.resolveKojMoodEmoji(mood, "🥣");
  }
  if (/^eating-\d{2}$/.test(asset)) return "😋";
  return MOOD_EMOJI[asset] || MOOD_EMOJI[mood] || "🥣";
}

function render(state, care, kojDisplay) {
  const pct = clamp(Number(state?.bowlPercent ?? state?.bowl?.percent ?? 0), 0, 100);
  pctEl.textContent = pct >= 1 ? `${Math.round(pct)} %` : `${pct.toFixed(1)} %`;
  fillEl.style.width = `${pct}%`;
  moodBadge.textContent = moodEmojiFor(kojDisplay);

  const needEmoji = safe(kojDisplay?.needEmoji) || safe(care?.needEmoji);
  const meta = safe(kojDisplay?.needLabel)
    ? `${needEmoji ? needEmoji + " " : ""}${safe(kojDisplay.needLabel)}`
    : safe(care?.needLabel)
      ? `${needEmoji ? needEmoji + " " : ""}${safe(care.needLabel)}`
      : `Nálada: ${safe(state?.mood, "idle")} · hlad ${Math.round(Number(state?.hunger || 0))}%`;
  if (care?.quest?.active && safe(care.quest.label)) {
    metaEl.textContent = `${meta} · ${care.quest.label}`;
  } else {
    metaEl.textContent = meta;
  }

  const tier = safe(state?.evolutionTier || state?.evolution?.tier, "egg");
  const tierLabel = safe(state?.evolution?.label || state?.evolution?.nextTierLabel, "Vejíčko");
  const fp = Math.round(Number(state?.feedPoints || state?.evolution?.feedPoints || 0));
  tierEl.textContent = tierLabel ? `${tierLabel} · ${fp}b` : `${tier}${fp ? ` · ${fp}b` : ""}`;

  const evoSprite = safe(kojDisplay?.evolutionSpriteUrl);
  if (evoSprite) {
    tierIconEl.src = `${API_BASE}${evoSprite}`;
    tierIconEl.classList.add("visible");
  } else {
    tierIconEl.removeAttribute("src");
    tierIconEl.classList.remove("visible");
  }

  panel.className = safe(kojDisplay?.panelClass) || "";
  if (!panel.className) {
    const mood = safe(kojDisplay?.mood || state?.mood, "idle");
    const hunger = Math.round(Number(state?.hunger || 0));
    if (state?.isSleeping || care?.need === "sleepy") panel.classList.add("sleepy");
    else if (care?.need === "sick" || state?.affliction === "sick") panel.classList.add("sick");
    else if (mood === "sad") panel.classList.add("sad");
    else if (pct >= 95 || mood === "full" || kojDisplay?.feeding) panel.classList.add(kojDisplay?.feeding ? "eating" : "full");
    else if (hunger >= 55 || mood === "hungry" || mood === "stressed" || mood === "annoyed") panel.classList.add("hungry");
  }
}

async function tick() {
  if (pollInFlight) return;
  pollInFlight = true;
  try {
    const res = await fetch(`${API_BASE}/overlay-state?_=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const state = data.kojnozoutState || data.kojnozroutState || {};
    render(state, data.careOpportunities, data.kojDisplay);
    pollFailStreak = 0;
  } catch (err) {
    pollFailStreak += 1;
    metaEl.textContent = "Server offline";
    moodBadge.textContent = "🥣";
    console.error("[BOWL_OVERLAY]", err);
  } finally {
    pollInFlight = false;
  }
}

function schedulePoll() {
  const delay = pollFailStreak > 0
    ? Math.min(POLL_BACKOFF_MS * pollFailStreak, 8000)
    : POLL_MS;
  setTimeout(async () => {
    await tick();
    schedulePoll();
  }, delay);
}

schedulePoll();
</script>
</body>
</html>
